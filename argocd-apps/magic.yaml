apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: magic
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Clusterforgers/k3s-cluster-manifests.git'
    targetRevision: HEAD
    path: apps/magic
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: magic
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true