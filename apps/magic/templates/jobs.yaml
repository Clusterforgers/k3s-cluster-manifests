# After each sync the compiler writes the rules of the stored cards again; unchanged cards are skipped.
# Before the first card load there is nothing to compile, which is not a failure of the release.
apiVersion: batch/v1
kind: Job
metadata:
  name: magic-compile
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: compile
          image: {{ include "magic.serverImage" . }}
          command:
            - sh
            - -c
            - |
              out=$(mtg-cli compile --all 2>&1) && { echo "$out"; mtg-cli coverage --all --snapshot || true; exit 0; }
              echo "$out"
              case "$out" in *"no cards are stored"*) exit 0 ;; esac
              exit 1
          env:
            {{- include "magic.databaseEnv" . | nindent 12 }}
            - name: MTG_RELEASE
              value: {{ .Values.tag | quote }}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
---
# The daily check for new cards and precons: it downloads what changed into a kept cache, loads and compiles it
# (deferred while a game runs) and records a coverage snapshot for the Card support page. By hand:
#   kubectl -n magic create job --from=cronjob/magic-ingest ingest-$(date +%F)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: magic-card-cache
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: 4Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: magic-ingest
spec:
  schedule: "0 4 * * *"
  timeZone: Europe/Copenhagen
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          {{- include "magic.podSecurity" . | nindent 10 }}
          containers:
            - name: ingest
              image: {{ include "magic.serverImage" . }}
              command: [mtg-cli, refresh]
              env:
                {{- include "magic.databaseEnv" . | nindent 16 }}
                - name: MTG_RELEASE
                  value: {{ .Values.tag | quote }}
                - name: MTG_CACHE_DIR
                  value: /cache
              resources:
                requests: {cpu: 200m, memory: 512Mi}
                limits: {memory: 4Gi}
              volumeMounts:
                - name: cache
                  mountPath: /cache
          volumes:
            - name: cache
              persistentVolumeClaim:
                claimName: magic-card-cache
