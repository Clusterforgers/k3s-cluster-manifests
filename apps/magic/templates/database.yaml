apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: magic-db
spec:
  serviceName: magic-db
  replicas: 1
  selector:
    matchLabels:
      app: magic-db
  template:
    metadata:
      labels:
        app: magic-db
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          env:
            - name: POSTGRES_USER
              value: magic
            - name: POSTGRES_DB
              value: magic
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            # A subdirectory keeps the volume's lost+found out of the data directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "magic", "-d", "magic"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "magic", "-d", "magic"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # The nightly dumps, to restore from or copy out.
            - name: backups
              mountPath: /backups
              readOnly: true
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: magic-backups
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.database }}
---
apiVersion: v1
kind: Service
metadata:
  name: magic-db
spec:
  selector:
    app: magic-db
  ports:
    - port: 5432
      targetPort: 5432
