# A nightly dump of the whole database onto its own volume; the newest `backup.keep` stay.
# Restore: see docs/magic.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: magic-backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.backups }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: magic-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          # uid 70 is the postgres user of the alpine image; it owns the volume's files.
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            fsGroup: 70
          containers:
            - name: dump
              image: {{ .Values.images.postgres }}
              command:
                - sh
                - -ec
                - |
                  file=/backups/magic-$(date +%Y-%m-%d-%H%M).dump
                  pg_dump -h magic-db -U magic -d magic -Fc -f "$file.part"
                  mv "$file.part" "$file"
                  ls -t /backups/magic-*.dump | tail -n +$(({{ .Values.backup.keep }} + 1)) | xargs -r rm -f
                  ls -lh /backups
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.existingSecret }}
                      key: POSTGRES_PASSWORD
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: magic-backups
