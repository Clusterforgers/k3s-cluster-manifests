---
# Web client
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: stoat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.images.web }}
          # Same as upstream's generated .env.web
          env:
            - name: VITE_HOST
              value: {{ .Values.host }}
            - name: VITE_API_URL
              value: https://{{ .Values.host }}/api
            - name: VITE_DEV_GIFBOX_URL
              value: https://{{ .Values.host }}/gifbox
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: stoat
spec:
  selector:
    app: web
  ports:
    - port: 5000
      targetPort: 5000

---
# Caddy: internal path router (see the caddy ConfigMap)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: stoat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: caddy
          image: {{ .Values.images.caddy }}
          env:
            # Plain :80 site, no automatic HTTPS - TLS ends at the nginx ingress.
            # (Also overrides the HOSTNAME Kubernetes sets to the pod name.)
            - name: HOSTNAME
              value: ":80"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: config
              mountPath: /stoat.json
              subPath: stoat.json
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: caddy

---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: stoat
spec:
  selector:
    app: caddy
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stoat
  namespace: stoat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.proxyBodySize | quote }}
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
  tls:
    - secretName: stoat-tls
      hosts:
        - {{ .Values.host }}
