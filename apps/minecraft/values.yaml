minecraft:
  nodeSelector:
    kubernetes.io/hostname: bullet

  image:
    tag: java21

  minecraftServer:
    eula: "TRUE"
    type: FTBA
    # FTB StoneBlock 4 1.23.0 (MC 1.21.1 / NeoForge 21.1.250). Pinned so a
    # resync doesn't silently upgrade the pack under an existing world.
    ftbModpackId: 130
    ftbModpackVersionId: 100554
    serviceType: LoadBalancer
    memory: 11264M
    motd: "StoneBlock 4"
    overrideServerProperties: true
    rcon:
      enabled: true
      password: "changeme123"

  startupProbe:
    enabled: true
    failureThreshold: 30
    periodSeconds: 10

  resources:
    requests:
      memory: 12Gi
    limits:
      memory: 13Gi

  persistence:
    dataDir:
      enabled: true
      # PVC is managed outside the chart (created during the Longhorn
      # migration); the chart's own PVC template renders a legacy
      # storage-class annotation that conflicts with the live object.
      existingClaim: minecraft-datadir
      Size: 20Gi
