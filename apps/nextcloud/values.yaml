nextcloud:
  image:
    registry: docker.io
    repository: library/nextcloud
    tag: 35.0.1-apache

  replicaCount: 1

  nodeSelector:
    kubernetes.io/hostname: queen

  nextcloud:
    host: hivemindcloud.dk
    podSecurityContext:
      fsGroup: 33
      fsGroupChangePolicy: OnRootMismatch

    trustedDomains:
      - hivemindcloud.dk
      - localhost
      - 10.42.*.*
      - 100.94.156.45
      - 100.96.184.94

    existingSecret:
      enabled: true
      secretName: nextcloud-credentials
      usernameKey: username
      passwordKey: password

    extraEnv:
      - name: TRUSTED_PROXIES
        value: "10.42.0.0/16 10.43.0.0/16"
      - name: FORWARDED_FOR_HEADERS
        value: "HTTP_X_FORWARDED_FOR"
      - name: PHP_OPCACHE_MEMORY_CONSUMPTION
        value: "256"

    phpConfigs:
      uploadLimit.ini: |
        upload_max_filesize = 16G
        post_max_size = 16G
        max_input_time = 3600
        max_execution_time = 3600

    defaultConfigs:
      # We ship our own redis.config.php below. The chart mounts `configs` and
      # `defaultConfigs` without deduping, and duplicate mountPaths are rejected
      # on resource creation.
      redis.config.php: false

    configs:
      custom.config.php: |-
        <?php
        $CONFIG = array(
          'default_phone_region' => 'DK',
          'maintenance_window_start' => 2,
          // Warnings and up; config.php had 0 (debug), which filled the log
          'loglevel' => 2,
        );
      redis.config.php: |-
        <?php
        $CONFIG = array(
          'memcache.local' => '\OC\Memcache\APCu',
          'memcache.locking' => '\OC\Memcache\Redis',
          'memcache.distributed' => '\OC\Memcache\Redis',
          'redis' => array(
            'host' => 'nextcloud-redis-master',
            'port' => 6379,
          ),
        );

    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 16Gi

    # Shared family-photos-shared PVC (apps/family-photos), also mounted by
    # Immich in this same namespace so both apps see the identical files —
    # PVCs are namespace-scoped, so Immich lives in the nextcloud namespace too.
    extraVolumes:
      - name: family-photos
        persistentVolumeClaim:
          claimName: family-photos-shared

    extraVolumeMounts:
      - name: family-photos
        mountPath: /mnt/family-photos

  internalDatabase:
    enabled: false

  externalDatabase:
    enabled: true
    type: mysql
    host: nextcloud-mariadb
    database: nextcloud
    user: nextcloud
    existingSecret:
      enabled: true
      secretName: nextcloud-db-credentials
      usernameKey: mariadb-username
      passwordKey: mariadb-password

  mariadb:
    enabled: true
    auth:
      database: nextcloud
      username: nextcloud
      existingSecret: nextcloud-db-credentials
    primary:
      persistence:
        enabled: true
        storageClass: longhorn-queen-bulk
        size: 5Gi

      # The chart's "small" preset (768Mi limit) was already ~85% used before
      # the buffer pool below was raised from its 128M default.
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          memory: 3Gi

      # Replaces the chart's my.cnf wholesale (there is no merge), so the
      # [mysqld] paths below are copied from the chart default. Tuned per
      # Nextcloud's own database advisor (Admin settings > System > Database).
      configuration: |-
        [mysqld]
        skip-name-resolve
        explicit_defaults_for_timestamp
        basedir=/opt/bitnami/mariadb
        datadir=/bitnami/mariadb/data
        plugin_dir=/opt/bitnami/mariadb/plugin
        port=3306
        socket=/opt/bitnami/mariadb/tmp/mysql.sock
        tmpdir=/opt/bitnami/mariadb/tmp
        max_allowed_packet=16M
        bind-address=*
        pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid
        log-error=/opt/bitnami/mariadb/logs/mysqld.log
        # Nextcloud's tables are already utf8mb4_bin; the chart default of UTF8
        # (utf8mb3) only applied to the server and schema defaults.
        character-set-server=utf8mb4
        collation-server=utf8mb4_bin
        binlog_expire_logs_seconds=2592000
        # Peak usage hit 128 of the default 151
        max_connections=250
        innodb_buffer_pool_size=1G
        innodb_log_file_size=256M
        tmp_table_size=64M
        max_heap_table_size=64M
        table_open_cache=4000
        # Off: the log would land on the container's ephemeral storage and
        # grow unbounded. Turn on temporarily when chasing a slow query.
        slow_query_log=0
        long_query_time=2

        [client]
        port=3306
        socket=/opt/bitnami/mariadb/tmp/mysql.sock
        default-character-set=utf8mb4
        plugin_dir=/opt/bitnami/mariadb/plugin

        [manager]
        port=3306
        socket=/opt/bitnami/mariadb/tmp/mysql.sock
        pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid

  redis:
    enabled: true
    auth:
      enabled: false

    # Nextcloud uses this purely as a cache and lock store, so a single node is
    # enough - the chart's default 3 read replicas just held redundant copies.
    architecture: standalone

    commonConfiguration: |-
      # No persistence: nothing here needs to outlive a restart. The chart's
      # default `appendonly yes` is what turned a single OOM kill into a
      # permanent crash loop, since every restart faithfully reloaded the
      # oversized dataset that caused the kill in the first place.
      appendonly no
      save ""
      # Without maxmemory Redis grows unbounded until the kernel OOM-kills the
      # container. This must stay comfortably below the container memory limit
      # below, so Redis evicts its own cold keys before the kernel intervenes.
      maxmemory 512mb
      maxmemory-policy allkeys-lru

    master:
      persistence:
        enabled: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 768Mi

  persistence:
    enabled: true
    storageClass: longhorn-queen-bulk
    size: 3Ti

  cronjob:
    enabled: true
    # Native CronJob instead of the crond sidecar: the sidecar requires root.
    # Inherits nodeSelector, so the job pod lands on queen and can mount the
    # same RWO Longhorn volume as the app pod.
    type: cronjob
    cronjob:
      schedule: "*/5 * * * *"
      successfulJobsHistoryLimit: 3
      failedJobsHistoryLimit: 5
      # A wedged run must not outlive the next trigger
      activeDeadlineSeconds: 280
      # The chart overrides the image entrypoint, so nothing drops privileges
      # for us: without this cron.php writes root-owned files into the data volume
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        runAsNonRoot: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi

  # The image entrypoint runs `occ upgrade` before Apache starts whenever the
  # image is newer than the installed version, with maintenance mode switched
  # on for the duration. With only the default liveness probe (~40s grace) the
  # kubelet kills the container mid-upgrade and Nextcloud is left stuck in
  # maintenance mode. Liveness/readiness are held off until this succeeds, so
  # an upgrade gets up to 30s + 60 * 10s = ~10.5 minutes to finish.
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 60

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: 16g
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/server-snippet: |-
        server_tokens off;
        rewrite ^/.well-known/webfinger /index.php/.well-known/webfinger last;
        rewrite ^/.well-known/nodeinfo /index.php/.well-known/nodeinfo last;
        rewrite ^/.well-known/host-meta /public.php?service=host-meta last;
        rewrite ^/.well-known/host-meta.json /public.php?service=host-meta-json;
        location = /.well-known/carddav {
          return 301 $scheme://$host/remote.php/dav;
        }
        location = /.well-known/caldav {
          return 301 $scheme://$host/remote.php/dav;
        }
    hosts:
      - host: hivemindcloud.dk
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nextcloud-tls
        hosts:
          - hivemindcloud.dk
